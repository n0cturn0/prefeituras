spring:
  application:
    name: cesta-precos-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cesta
    username: cesta
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
